name: Deploy color explorer

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "scripts/**",
        "Sources/**",
        "package.json",
        "package-lock.json",
        "playwright.config.mjs",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "scripts/**",
        "Sources/**",
        "package.json",
        "package-lock.json",
        "playwright.config.mjs",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify source data and color utilities
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B scripts/export-palettes.py --check
          npm test
          node --check site/app.mjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify explorer interactions and responsive layout
        run: npm run test:browser
      - name: Assemble static site
        run: |
          mkdir -p _site/fonts
          cp site/index.html site/style.css site/app.mjs site/model.mjs site/palettes.json site/favicon.svg _site/
          cp site/fonts/* _site/fonts/
          touch _site/.nojekyll
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
